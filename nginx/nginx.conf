events {}
http {
  upstream campuscart {
    server api1:8000 max_fails=1 fail_timeout=5s;
    server api2:8000 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://campuscart;
      proxy_next_upstream error timeout http_502 http_503 http_500;
      proxy_connect_timeout 1s;
    }
  }
}
